name: Préproduction L10 (manuelle)
on:
  workflow_dispatch:
    inputs:
      sha:
        description: SHA complet sur main avec CI réussie
        required: true
        type: string
      maintenance_confirmed:
        description: Maintenance posée sur le VPS isolé et comptes synthétiques uniquement
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
# Groupe PARTAGÉ avec le job deploy de ci.yml (même VPS IONOS, 4 Go de RAM) : un seul
# build/déploiement DigiSanté à la fois sur l'hôte.
concurrency:
  group: deploy-ionos-srv1
  cancel-in-progress: false
jobs:
  preproduction:
    if: vars.PREPROD_DEPLOY_ENABLED == 'true' && inputs.maintenance_confirmed
    runs-on: ubuntu-latest
    steps:
      # Checkout initial de main uniquement pour la garde ; aucun code du SHA non qualifié.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Vérifier SHA et deux jobs CI exacts
        run: node scripts/preproduction/verify-candidate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.sha }}
      - name: Vérifier la présence des accès dédiés (aucune valeur affichée)
        run: |
          node -e 'for(const k of ["HOST","USER","KEY","FINGERPRINT","MIGRATION"]){if(!process.env[k]){console.error("Accès dédié incomplet : "+k);process.exit(1)}}'
        env:
          HOST: ${{ secrets.PREPROD_VPS_HOST }}
          USER: ${{ secrets.PREPROD_VPS_USER }}
          KEY: ${{ secrets.PREPROD_VPS_SSH_KEY }}
          FINGERPRINT: ${{ secrets.PREPROD_VPS_FINGERPRINT }}
          MIGRATION: ${{ secrets.PREPROD_DB_MIGRATION_URL }}
      - name: Déployer la candidate exacte en maintenance (aucun smoke fournisseur)
        # Revue GO du 22/10/2026 : URL du rôle PROPRIÉTAIRE PostgreSQL (migrations) transmise par
        # l'entrée standard SSH (scripts/deploy/ssh-deploy.sh, empreinte d'hôte vérifiée), jamais
        # dans la commande distante : sur l'hôte partagé, /proc/<pid>/cmdline est lisible par tous.
        env:
          VPS_HOST: ${{ secrets.PREPROD_VPS_HOST }}
          VPS_USER: ${{ secrets.PREPROD_VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.PREPROD_VPS_SSH_KEY }}
          VPS_FINGERPRINT: ${{ secrets.PREPROD_VPS_FINGERPRINT }}
          VPS_SSH_PORT: ${{ secrets.PREPROD_VPS_SSH_PORT || 22 }}
          MIGRATION_DATABASE_URL: ${{ secrets.PREPROD_DB_MIGRATION_URL }}
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote="$(mktemp)"
          cat > "$remote" <<'REMOTE'
          set -e
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Checkout de préproduction sur l'hôte IONOS partagé (= APP_DIR du profil preproduction).
          cd /var/www/digisante-preprod
          git fetch origin main
          # L'outillage de contrôle vient du main récupéré ; le code applicatif
          # reste exactement celui de la candidate qualifiée ci-dessus.
          MAIN_SHA="$(git rev-parse --verify 'origin/main^{commit}')"
          printf 'Outillage de déploiement : main %s\n' "$MAIN_SHA"
          deploy_script=$(mktemp)
          trap 'rm -f "$deploy_script"' EXIT
          git show "$MAIN_SHA:infra/deploy/scripts/deploy.sh" > "$deploy_script"
          DEPLOY_TOOLING_SHA="$MAIN_SHA" DEPLOY_REF="$CANDIDATE_SHA" DEPLOY_ENVIRONMENT=preproduction DEPLOY_MAINTENANCE_READY=1 bash "$deploy_script"
          REMOTE
          bash scripts/deploy/ssh-deploy.sh "$remote" "CANDIDATE_SHA=$CANDIDATE_SHA"
