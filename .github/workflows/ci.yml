name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: digisante
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: digisante_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://digisante:devpassword@localhost:5432/digisante_test?schema=public
      # Base Redis 1 dédiée aux tests (purgée au début du run, cf. vitest.global-setup.ts).
      REDIS_URL: redis://localhost:6379/1
      NODE_ENV: test
      JWT_SECRET: ci-secret
      RECONCILE_TOKEN: ci-synthetic-service-token-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      # Version de pnpm lue depuis le champ "packageManager" du package.json
      # (ne pas spécifier "version" ici : conflit ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @digisante/api prisma generate
      - run: pnpm --filter @digisante/api prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Contrôles techniques L9/L10 (aucune validation humaine simulée)
        run: |
          pnpm test:scripts
          node scripts/i18n/check-coverage.mjs --require-complete=en
          pnpm validation:check
          pnpm validation:campaign:check
          pnpm preprod:check
          python scripts/docs/validate-implementation-plan.py
          for script in infra/deploy/scripts/*.sh; do bash -n "$script"; done
          python scripts/docs/validate-l9-dossier.py
      - run: pnpm test
      # Revue GO du 22/10/2026 : l'API de production tourne sous un rôle NON propriétaire
      # (`<base>_app`, droits appliqués par deploy.sh). La suite API est rejouée sous ce rôle
      # pour prouver que le code n'a besoin d'aucun droit de propriétaire (DDL, UPDATE/DELETE
      # sur l'audit…). Le test du rôle lui-même exige la connexion propriétaire : exclu ici.
      - name: Suite API sous le rôle d'exécution non propriétaire
        env:
          PGHOST: localhost
          PGUSER: digisante
          PGPASSWORD: devpassword
          PGDATABASE: digisante_test
        run: |
          psql -X -q -v ON_ERROR_STOP=1 -c "CREATE ROLE digisante_test_app LOGIN PASSWORD 'ci-synthetic-runtime-role'"
          node scripts/infra/runtime-grants-sql.mjs | psql -X -q -A -t -v app_role=digisante_test_app
          DATABASE_URL='postgresql://digisante_test_app:ci-synthetic-runtime-role@localhost:5432/digisante_test?schema=public' \
            pnpm --filter @digisante/api exec vitest run --exclude src/lib/runtime-role.test.ts
      - run: pnpm build

  # ── Tests e2e (Playwright) ──
  # Job SÉPARÉ : il démarre la pile complète (API + web) et télécharge un
  # navigateur, ce qui n'a pas sa place dans `build-and-test`.
  #
  # Le web est PROXIFIÉ vers l'API (`E2E_API_PROXY`) pour reproduire la topologie
  # de production — une seule origine derrière Nginx. Sans ça, la CSP de
  # l'application (`connect-src 'self'`) bloque ses propres appels en http, et le
  # cookie de refresh `SameSite=Strict` devient cross-site.
  # `NEXT_PUBLIC_API_URL` vide ⇒ le client appelle `/api/v1/...` en relatif.
  # Ces deux variables doivent être posées AU BUILD (inlining Next).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: digisante
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: digisante_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://digisante:devpassword@localhost:5432/digisante_e2e?schema=public
      REDIS_URL: redis://localhost:6379/2
      NODE_ENV: test
      JWT_SECRET: e2e-secret-at-least-32-characters-long-xx
      RECONCILE_TOKEN: ci-synthetic-service-token-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @digisante/api prisma generate
      - run: pnpm --filter @digisante/api prisma migrate deploy
      - name: Build (proxy API activé, URL d'API relative)
        run: pnpm build
        env:
          E2E_API_PROXY: http://127.0.0.1:3011
          NEXT_PUBLIC_API_URL: ""
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Déploiement production, VPS IONOS partagé (SSH) ──
  # Opt-in : ne s'exécute QUE si les variables de dépôt DEPLOY_ENABLED == 'true' ET
  # DEPLOY_MAINTENANCE_READY == 'true' (Settings → Secrets and variables → Actions →
  # Variables). Tant qu'elles sont absentes, main reste verte. Activer seulement dans une
  # fenêtre autorisée, maintenance Nginx vérifiée, VPS prêt et secrets posés.
  # Secrets requis : VPS_HOST · VPS_USER · VPS_SSH_KEY (clé privée) · VPS_FINGERPRINT (empreinte SHA256 de la clé d’hôte) · VPS_SSH_PORT (optionnel)
  deploy:
    # Les e2e gardent aussi la porte : inutile de déployer une application dont
    # le parcours d'inscription ou le triage hors-ligne est cassé.
    needs: [build-and-test, e2e]
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && vars.DEPLOY_ENABLED == 'true'
      && vars.DEPLOY_MAINTENANCE_READY == 'true'
    runs-on: ubuntu-latest
    # Groupe PARTAGÉ avec preproduction.yml : préproduction et production vivent sur le même
    # VPS IONOS (4 Go de RAM, avec ImmiPro, BeninLink, PG, Valkey, Grafana) ; deux
    # `pnpm build` simultanés exposeraient les applications voisines à l'OOM killer.
    concurrency:
      group: deploy-ionos-srv1
      cancel-in-progress: false
    steps:
      # Même garde que la préproduction L10 : sans empreinte, ssh-action ne vérifie
      # PAS la clé d'hôte (un DNS détourné « déploierait » sur un autre serveur).
      - name: Vérifier la présence des accès (aucune valeur affichée)
        run: |
          node -e 'for(const k of ["HOST","USER","KEY","FINGERPRINT","MIGRATION"]){if(!process.env[k]){console.error("Accès production incomplet : "+k);process.exit(1)}}'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
          MIGRATION: ${{ secrets.DB_MIGRATION_URL }}
      # Outillage de déploiement (ssh-deploy.sh) issu de main, comme la garde de deploy.sh.
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Déploiement SSH sur le VPS
        # Revue GO du 22/10/2026 : appleboy/ssh-action remplacé. Ses `envs` sont recopiés dans la
        # commande distante, lisible par tous les comptes de l'hôte partagé (/proc/<pid>/cmdline) :
        # l'URL du rôle PROPRIÉTAIRE PostgreSQL passe par l'entrée standard (ssh-deploy.sh), et la
        # clé d'hôte est vérifiée contre VPS_FINGERPRINT avant toute connexion.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || 22 }}
          MIGRATION_DATABASE_URL: ${{ secrets.DB_MIGRATION_URL }}
        run: |
          remote="$(mktemp)"
          cat > "$remote" <<'REMOTE'
          set -e
          # Checkout de production sur l'hôte IONOS partagé (= APP_DIR du profil production).
          cd /var/www/digisante
          git fetch origin main
          # Garde issue du main récupéré, même si la candidate est ancienne : son
          # deploy.sh historique pourrait ignorer les protections ajoutées depuis.
          MAIN_SHA="$(git rev-parse --verify 'origin/main^{commit}')"
          printf 'Outillage de déploiement : main %s\n' "$MAIN_SHA"
          deploy_script=$(mktemp)
          trap 'rm -f "$deploy_script"' EXIT
          git show "$MAIN_SHA:infra/deploy/scripts/deploy.sh" > "$deploy_script"
          DEPLOY_TOOLING_SHA="$MAIN_SHA" DEPLOY_REF='${{ github.sha }}' DEPLOY_ENVIRONMENT=production DEPLOY_MAINTENANCE_READY=1 bash "$deploy_script"
          REMOTE
          bash scripts/deploy/ssh-deploy.sh "$remote"
