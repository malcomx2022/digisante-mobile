name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: digisante
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: digisante_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://digisante:devpassword@localhost:5432/digisante_test?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      # Version de pnpm lue depuis le champ "packageManager" du package.json
      # (ne pas spécifier "version" ici : conflit ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @digisante/api prisma generate
      - run: pnpm --filter @digisante/api prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # ── Déploiement VPS Infomaniak (SSH) ──
  # Opt-in : ne s'exécute QUE si la variable de dépôt DEPLOY_ENABLED == 'true'
  # (Settings → Secrets and variables → Actions → Variables). Tant qu'elle est
  # absente, main reste verte. Activer une fois le VPS prêt + les secrets posés.
  # Secrets requis : VPS_HOST · VPS_USER · VPS_SSH_KEY (clé privée) · VPS_SSH_PORT (optionnel)
  deploy:
    needs: build-and-test
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Déploiement SSH sur le VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            cd /var/www/digisante-mobile
            bash infra/deploy/scripts/deploy.sh
