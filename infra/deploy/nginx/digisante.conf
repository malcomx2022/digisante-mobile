# ─────────────────────────────────────────────────────────────
# Nginx — DigiSanté Mobile (reverse proxy + SSL Certbot)
# cf. CLAUDE.md §7 — VPS Infomaniak Ubuntu 22.04.
#
# Installation :
#   sudo cp infra/deploy/nginx/digisante.conf /etc/nginx/sites-available/digisante
#   sudo ln -sf /etc/nginx/sites-available/digisante /etc/nginx/sites-enabled/digisante
#   sudo nginx -t && sudo systemctl reload nginx
#
# Puis émettre le certificat (Certbot ajoute lui-même le bloc 443 + redirection) :
#   sudo certbot --nginx -d digisante.example.bj -d www.digisante.example.bj
#
# ⚠️ Remplacer `digisante.example.bj` par le domaine réel avant émission SSL.
# ─────────────────────────────────────────────────────────────

# Web Next.js (App Router, PWA) — port local 3000
upstream digisante_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# API Fastify (cluster PM2 ×2) — port local 3001, routes préfixées /api/v1
upstream digisante_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name digisante.example.bj www.digisante.example.bj;

    # Certbot place ici le challenge ACME ; après émission SSL il redirige 80→443.
    root /var/www/html;

    # Taille des uploads (documents DMP, pièces jointes ordonnances/labo).
    client_max_body_size 25m;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml application/wasm;

    # ── En-têtes de sécurité (HSTS ajouté après bascule HTTPS) ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Authentification : rate-limit strict (anti brute-force OTP) ──
    # (zone définie dans conf.d/digisante-rate-limit.conf)
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://digisante_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket temps réel (chat) : upgrade + timeout long (évite la coupure idle) ──
    location = /api/v1/chat/ws {
        # ⚠️ Le JWT transite en QUERY ici (les navigateurs ne posent pas d'en-tête
        # Authorization sur un WS, CLAUDE.md §8). Le format `combined` par défaut
        # journaliserait l'URL COMPLÈTE → jeton de session en clair dans les logs.
        # `digisante_noquery` (conf.d/digisante-rate-limit.conf) journalise `$uri`,
        # donc le chemin sans les arguments.
        access_log /var/log/nginx/digisante-ws.log digisante_noquery;
        proxy_pass http://digisante_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── API Fastify : tout /api/* → backend (les routes sont /api/v1/...) ──
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://digisante_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Service worker / manifeste PWA : pas de cache agressif ──
    location = /sw.js {
        proxy_pass http://digisante_web;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # SW FCM : même règle — une nouvelle version (correctif, rotation de SDK) doit
    # être récupérée au prochain enregistrement, pas après expiration d'un cache.
    location = /firebase-messaging-sw.js {
        proxy_pass http://digisante_web;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.json {
        proxy_pass http://digisante_web;
    }

    # ── Assets statiques Next.js : cache long (hashés par le build) ──
    location /_next/static/ {
        proxy_pass http://digisante_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Tout le reste → Next.js ──
    location / {
        proxy_pass http://digisante_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
