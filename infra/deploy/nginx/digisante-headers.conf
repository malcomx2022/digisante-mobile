# En-têtes de sécurité DigiSanté — inclus par les blocs HTTPS des vhosts digisante et
# digisante-preprod (et par chaque location qui pose son propre add_header : Nginx ne
# fait pas hériter add_header dans ce cas). Installé par provision-ionos.sh dans
# /etc/nginx/snippets/digisante-headers.conf (nom préfixé : hôte partagé).
# DENY, comme Next.js (`frame-ancestors 'none'`) : SAMEORIGIN produirait DEUX
# X-Frame-Options contradictoires sur les pages web.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
