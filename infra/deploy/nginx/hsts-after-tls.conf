# L8 — HSTS servi seulement après validation du certificat, redirection HTTP→HTTPS et
# test de renouvellement Certbot : provision-ionos.sh l'installe comme
# /etc/nginx/snippets/digisante-hsts.conf et n'active le vhost TLS (qui l'inclut)
# qu'après `certbot renew --cert-name … --dry-run` réussi.
# Commencer avec 24 h ; ni includeSubDomains ni preload sans revue des sous-domaines.
# Si une location définit add_header, y inclure aussi ce fichier (héritage Nginx).
add_header Strict-Transport-Security "max-age=86400" always;
