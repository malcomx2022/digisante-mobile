# L8 — inclusion MANUELLE seulement dans le serveur HTTPS, après validation
# du certificat, redirection HTTP→HTTPS et test de renouvellement Certbot.
# Commencer avec 24 h ; ni includeSubDomains ni preload sans revue des sous-domaines.
# Si une location définit add_header, y inclure aussi ce fichier (héritage Nginx).
add_header Strict-Transport-Security "max-age=86400" always;
