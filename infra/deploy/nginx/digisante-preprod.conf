# ─────────────────────────────────────────────────────────────
# Nginx — DigiSanté Mobile PRÉPRODUCTION (reverse proxy + SSL Certbot)
# cf. CLAUDE.md §7 — VPS IONOS partagé (ImmiPro, BeninLink) : preprod.digisantemobile.app.
# IDENTIQUE à digisante.conf (production) hors marqueurs d'environnement : upstreams
# digisante_preprod_*, ports 3100/3101, domaine, journaux digisante-preprod-* (test de
# non-dérive). Les zones de limitation (digisante-rate-limit.conf) sont COMMUNES aux deux
# environnements : une même IP partage ses quotas entre préproduction et production.
#
# Installation (copie root installée par install_root_scripts.sh — jamais APP_DIR, B3) :
#   R=/usr/local/lib/digisante-preprod/infra/deploy/nginx
#   sudo install -m 0644 "$R/digisante-preprod.conf" /etc/nginx/sites-available/digisante-preprod
#   sudo ln -sf /etc/nginx/sites-available/digisante-preprod /etc/nginx/sites-enabled/digisante-preprod
#   sudo nginx -t && sudo systemctl reload nginx
#
# Puis émettre le certificat (Certbot ajoute lui-même le bloc 443 + redirection) :
#   sudo certbot --nginx -d preprod.digisantemobile.app
# ─────────────────────────────────────────────────────────────

# Web Next.js (App Router, PWA) — port local 3100 (DIGISANTE_ENV=preproduction)
upstream digisante_preprod_web {
    server 127.0.0.1:3100;
    keepalive 32;
}

# API Fastify (cluster PM2 ×2) — port local 3101, routes préfixées /api/v1
upstream digisante_preprod_api {
    server 127.0.0.1:3101;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name preprod.digisantemobile.app;

    # Au niveau du SERVEUR, pas de http{} : sur l'hôte partagé, ces directives globales
    # entreraient en conflit (ou s'imposeraient) avec les autres applications.
    server_tokens off;
    limit_req_status 429;

    # Hérité par toutes les locations : ni query (QR/JWT), ni Referer qui pourrait
    # porter un ancien lien DMP. Ne journaliser aucun corps/en-tête sensible.
    access_log /var/log/nginx/digisante-preprod-access.log digisante_noquery;
    # Nginx ne propose pas de format expurgé pour error_log : une erreur upstream
    # recopie request et Referer avec les jetons. Statuts via access_log ci-dessus,
    # diagnostics via les logs structurés expurgés API ; aucun error_log de requête.
    error_log /dev/null;

    # Certbot place ici le challenge ACME ; après émission SSL il redirige 80→443.
    root /var/www/html;

    # Taille des uploads (documents DMP, pièces jointes ordonnances/labo).
    client_max_body_size 25m;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml application/wasm;

    # ── En-têtes de sécurité (HSTS ajouté après bascule HTTPS) ──
    # DENY, comme Next.js (`frame-ancestors 'none'`) : SAMEORIGIN ici produisait DEUX
    # X-Frame-Options contradictoires sur les pages web.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Reprise de session / déconnexion : zone GÉNÉRALE, pas la zone stricte ──
    # `/auth/refresh` est appelé à CHAQUE ouverture de l'app. Les opérateurs mobiles
    # béninois partagent une même IP publique entre de nombreux abonnés (CGNAT) :
    # à 10 req/min par IP, la zone `digisante_rl_auth` déconnecterait des utilisateurs légitimes.
    # Le brute-force porte sur l'OTP, qui reste sous la zone stricte ci-dessous
    # (et sous le verrou applicatif 5 échecs / 30 min).
    location ~ ^/api/v1/auth/(refresh|logout)$ {
        limit_req zone=digisante_rl_api burst=20 nodelay;
        proxy_pass http://digisante_preprod_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Authentification : rate-limit strict (anti brute-force OTP) ──
    # (zone définie dans conf.d/digisante-rate-limit.conf)
    location /api/v1/auth/ {
        limit_req zone=digisante_rl_auth burst=5 nodelay;
        proxy_pass http://digisante_preprod_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket temps réel (chat) : upgrade + timeout long (évite la coupure idle) ──
    location = /api/v1/chat/ws {
        # ⚠️ Le JWT transite en QUERY ici (les navigateurs ne posent pas d'en-tête
        # Authorization sur un WS, CLAUDE.md §8). Le format `combined` par défaut
        # journaliserait l'URL COMPLÈTE → jeton de session en clair dans les logs.
        # `digisante_noquery` (conf.d/digisante-rate-limit.conf) journalise `$uri`,
        # donc le chemin sans les arguments.
        access_log /var/log/nginx/digisante-preprod-ws.log digisante_noquery;
        proxy_pass http://digisante_preprod_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── API Fastify : tout /api/* → backend (les routes sont /api/v1/...) ──
    location /api/ {
        limit_req zone=digisante_rl_api burst=20 nodelay;
        proxy_pass http://digisante_preprod_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Service worker / manifeste PWA : pas de cache agressif ──
    location = /sw.js {
        proxy_pass http://digisante_preprod_web;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # SW FCM : même règle — une nouvelle version (correctif, rotation de SDK) doit
    # être récupérée au prochain enregistrement, pas après expiration d'un cache.
    location = /firebase-messaging-sw.js {
        proxy_pass http://digisante_preprod_web;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.json {
        proxy_pass http://digisante_preprod_web;
    }

    # ── Assets statiques Next.js : cache long (hashés par le build) ──
    location /_next/static/ {
        proxy_pass http://digisante_preprod_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Tout le reste → Next.js ──
    location / {
        proxy_pass http://digisante_preprod_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
