# ─────────────────────────────────────────────────────────────
# Nginx — DigiSanté Mobile PRÉPRODUCTION (reverse proxy + TLS Let's Encrypt)
# cf. CLAUDE.md §7 — VPS IONOS partagé (ImmiPro, BeninLink) : preprod.digisantemobile.app.
# IDENTIQUE à digisante.conf (production) hors marqueurs d'environnement : upstreams
# digisante_preprod_*, ports 3100/3101, domaine et certificat, journaux digisante-preprod-*,
# bloc www (production seulement) — test de non-dérive scripts/infra/environments.test.mjs.
# Zones de limitation et format de journal (conf.d/digisante-rate-limit.conf) et en-têtes
# (snippets/digisante-*.conf) COMMUNS aux deux environnements, préfixés digisante.
#
# Installé par infra/deploy/scripts/provision-ionos.sh (étape nginx), depuis la copie root
# (B3), APRÈS émission du certificat (certbot certonly --webroot, jamais --nginx : Certbot
# ne réécrit pas ce fichier) et `certbot renew --dry-run` réussi : HSTS n'est donc servi
# qu'une fois TLS et renouvellement validés (L8). Ne modifie aucun autre vhost de l'hôte.
# ─────────────────────────────────────────────────────────────

# Web Next.js (App Router, PWA) — port local 3100 (DIGISANTE_ENV=preproduction)
upstream digisante_preprod_web {
    server 127.0.0.1:3100;
    keepalive 32;
}

# API Fastify (cluster PM2 ×2) — port local 3101, routes préfixées /api/v1
upstream digisante_preprod_api {
    server 127.0.0.1:3101;
    keepalive 32;
}

# HTTP : challenge ACME (renouvellement webroot) puis redirection vers HTTPS, rien d'autre.
server {
    listen 80;
    listen [::]:80;
    server_name preprod.digisantemobile.app;
    server_tokens off;
    access_log /var/log/nginx/digisante-preprod-access.log digisante_noquery;
    error_log /dev/null;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/digisante-acme;
        default_type text/plain;
    }
    # Nom canonique en dur : jamais l'en-tête Host du client dans la redirection.
    location / {
        return 301 https://preprod.digisantemobile.app$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name preprod.digisantemobile.app;

    ssl_certificate     /etc/letsencrypt/live/preprod.digisantemobile.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preprod.digisantemobile.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    # Au niveau du SERVEUR, pas de http{} : sur l'hôte partagé, ces directives globales
    # entreraient en conflit (ou s'imposeraient) avec les autres applications.
    server_tokens off;
    limit_req_status 429;

    # Hérité par toutes les locations : ni query (QR/JWT), ni Referer qui pourrait
    # porter un ancien lien DMP. Ne journaliser aucun corps/en-tête sensible.
    access_log /var/log/nginx/digisante-preprod-access.log digisante_noquery;
    # Nginx ne propose pas de format expurgé pour error_log : une erreur upstream
    # recopie request et Referer avec les jetons. Statuts via access_log ci-dessus,
    # diagnostics via les logs structurés expurgés API ; aucun error_log de requête.
    error_log /dev/null;

    # = plus grand bodyLimit de l'API (8 Mio : pièces KYC/DMP de 5 Mo en base64 + JSON,
    # kyc.routes.ts / dmp.routes.ts) ; au-delà, refus 413 par Nginx avant l'API.
    client_max_body_size 8m;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/manifest+json image/svg+xml application/wasm;

    # ── En-têtes de sécurité + HSTS (24 h, L8) ──
    # Une location qui pose son propre add_header N'HÉRITE PAS de ceux du serveur :
    # chaque location concernée ré-inclut ces deux fichiers.
    include /etc/nginx/snippets/digisante-headers.conf;
    include /etc/nginx/snippets/digisante-hsts.conf;

    # ── Sondes : jamais journalisées (interrogées en continu par la surveillance) ──
    location = /api/v1/health {
        access_log off;
        proxy_pass http://digisante_preprod_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/ready {
        access_log off;
        proxy_pass http://digisante_preprod_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Reprise de session / déconnexion : zone GÉNÉRALE, pas la zone stricte ──
    # `/auth/refresh` est appelé à CHAQUE ouverture de l'app. Les opérateurs mobiles
    # béninois partagent une même IP publique entre de nombreux abonnés (CGNAT) :
    # à 10 req/min par IP, la zone `digisante_rl_auth` déconnecterait des utilisateurs légitimes.
    # Le brute-force porte sur l'OTP, qui reste sous la zone stricte ci-dessous
    # (et sous le verrou applicatif 5 échecs / 30 min).
    location ~ ^/api/v1/auth/(refresh|logout)$ {
        limit_req zone=digisante_rl_api burst=20 nodelay;
        proxy_pass http://digisante_preprod_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Authentification : rate-limit strict (anti brute-force OTP) ──
    # (zone définie dans conf.d/digisante-rate-limit.conf)
    location /api/v1/auth/ {
        limit_req zone=digisante_rl_auth burst=5 nodelay;
        proxy_pass http://digisante_preprod_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket temps réel (chat) : upgrade + timeout long (évite la coupure idle) ──
    location = /api/v1/chat/ws {
        # ⚠️ Le JWT transite en QUERY ici (les navigateurs ne posent pas d'en-tête
        # Authorization sur un WS, CLAUDE.md §8). Le format `combined` par défaut
        # journaliserait l'URL COMPLÈTE → jeton de session en clair dans les logs.
        # `digisante_noquery` (conf.d/digisante-rate-limit.conf) journalise `$uri`,
        # donc le chemin sans les arguments.
        access_log /var/log/nginx/digisante-preprod-ws.log digisante_noquery;
        proxy_pass http://digisante_preprod_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── API Fastify : tout /api/* → backend (les routes sont /api/v1/...) ──
    location /api/ {
        limit_req zone=digisante_rl_api burst=20 nodelay;
        proxy_pass http://digisante_preprod_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Service worker / manifeste PWA : pas de cache agressif ──
    location = /sw.js {
        proxy_pass http://digisante_preprod_web;
        include /etc/nginx/snippets/digisante-headers.conf;
        include /etc/nginx/snippets/digisante-hsts.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # SW FCM : même règle — une nouvelle version (correctif, rotation de SDK) doit
    # être récupérée au prochain enregistrement, pas après expiration d'un cache.
    location = /firebase-messaging-sw.js {
        proxy_pass http://digisante_preprod_web;
        include /etc/nginx/snippets/digisante-headers.conf;
        include /etc/nginx/snippets/digisante-hsts.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.json {
        proxy_pass http://digisante_preprod_web;
    }

    # ── Assets statiques Next.js : cache long (hashés par le build) ──
    location /_next/static/ {
        proxy_pass http://digisante_preprod_web;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/digisante-headers.conf;
        include /etc/nginx/snippets/digisante-hsts.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Tout le reste → Next.js ──
    location / {
        proxy_pass http://digisante_preprod_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
