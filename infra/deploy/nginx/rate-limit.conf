# ─────────────────────────────────────────────────────────────
# Zones de limitation de débit Nginx — DigiSanté Mobile (défense DoS / brute-force).
# À placer UNE FOIS dans /etc/nginx/conf.d/ (contexte http{}) : COMMUN aux vhosts
# digisante (production) et digisante-preprod, qui appliquent les `limit_req` (P7.2),
# chacun sur SES zones (digisante_rl_* / digisante_rl_preprod_*).
# Hôte IONOS partagé : noms PRÉFIXÉS (une zone ou un format de même nom défini par une
# autre application ferait échouer `nginx -t` pour tout l'hôte) et AUCUNE directive
# globale (server_tokens, limit_req_status : posées dans les blocs server DigiSanté).
#   sudo install -m 0644 /usr/local/lib/digisante/infra/deploy/nginx/rate-limit.conf /etc/nginx/conf.d/digisante-rate-limit.conf
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────

# Une paire de zones PAR ENVIRONNEMENT (revue GO du 22/10/2026, résiduel 4) : une même IP
# (bureau, NAT d'opérateur mobile, recette) n'épuise plus le quota de la production en
# testant la préproduction, et inversement. Mêmes débits ; seuls les noms diffèrent.
# Les zones de production gardent leur nom historique (un vhost préproduction antérieur
# qui les référence reste valide pendant la bascule).

# API générale : 100 requêtes/minute par IP.
limit_req_zone $binary_remote_addr zone=digisante_rl_api:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=digisante_rl_preprod_api:10m rate=100r/m;

# Authentification (OTP, register, refresh) : 10 requêtes/minute par IP (strict).
limit_req_zone $binary_remote_addr zone=digisante_rl_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=digisante_rl_preprod_auth:10m rate=10r/m;

# ─────────────────────────────────────────────────────────────
# Format de log SANS chaîne de requête — pour le WebSocket du chat.
#
# ⚠️ Le JWT d'accès y transite en QUERY (`/api/v1/chat/ws?token=…`) : les
# navigateurs ne posent pas d'en-tête `Authorization` sur un WebSocket
# (CLAUDE.md §8). Le format `combined` par défaut journalise `$request`, donc
# l'URL COMPLÈTE — un jeton de session valide se retrouverait en clair dans
# /var/log/nginx/access.log, conservé et tourné pendant des semaines.
#
# `$uri` est le chemin NORMALISÉ, sans les arguments : on garde la traçabilité
# des connexions (IP, statut, volume) sans le secret. Côté application, le
# sérialiseur `lib/log-sanitize.ts` fait déjà l'équivalent — il manquait le
# maillon Nginx.
# ─────────────────────────────────────────────────────────────
log_format digisante_noquery '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent';
